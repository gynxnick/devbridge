[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/git", "crates/workspace", "crates/fs", "crates/net", "crates/sync", "crates/remote", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
devbridge-core = { path = "crates/core" }
devbridge-store = { path = "crates/store" }
devbridge-git = { path = "crates/git" }
devbridge-workspace = { path = "crates/workspace" }
devbridge-fs = { path = "crates/fs" }
devbridge-net = { path = "crates/net" }
devbridge-sync = { path = "crates/sync" }
devbridge-remote = { path = "crates/remote" }

anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
data-encoding = "2.11.1"
fs4 = "1.1.0"
futures-util = "0.3.34"
ignore = "0.4.33"
keyring = "4.2.0"
mdns-sd = "0.21.6"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
proptest = "1.12.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
regex = "1.13.1"
tracing-appender = "0.2.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
spake2 = "0.4.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
unicode-normalization = "0.1.26"
dirs = "7.0.0"
gethostname = "1.1.0"
os_info = { version = "3.15.0", default-features = false }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }
which = "8.0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
