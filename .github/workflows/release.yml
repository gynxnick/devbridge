name: Release
# Builds installers for macOS (universal .dmg) and Windows (.msi + NSIS setup .exe),
# attaches them to a draft pre-release and uploads them as workflow artifacts.
# Runs on version tags, or manually: Actions → Release → Run workflow.
# Installers are signed only when the signing secrets exist (see docs/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Missing secrets expand to empty strings, which would make the bundler
      # attempt (and fail) signing. Export only the ones that are set.
      - name: Signing environment (only when secrets are configured)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__DEVBRIDGE_EOF__"; printf '%s\n' "${!v}"; echo "__DEVBRIDGE_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: DevBridge v__VERSION__
          releaseBody: Automated build. Unsigned unless signing secrets are configured. See docs/RELEASE.md before publishing.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-${{ matrix.os }}
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
